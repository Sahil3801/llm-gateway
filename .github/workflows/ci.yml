# Runs the full test suite (unit + WireMock + Testcontainers) on every push and pull request to main.
#
# Why ubuntu-latest: GitHub's Linux runners come with Docker already installed and running, which is
# exactly what Testcontainers needs to start Redis. (Windows/macOS runners don't offer Linux
# containers, so the Redis tests couldn't run there.)
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Least privilege: this workflow only needs to read the code.
permissions:
  contents: read

# A newer push to the same branch/PR cancels the run that is now outdated, saving runner minutes.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Build and test (Java 21)
    runs-on: ubuntu-latest
    # A hung test (e.g. a stuck container) fails the job instead of burning hours of minutes.
    timeout-minutes: 15

    steps:
      - name: Check out the code
        uses: actions/checkout@v5

      - name: Set up Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
          # Caches ~/.m2 keyed on pom.xml, so dependencies aren't re-downloaded on every run.
          cache: maven

      # Not strictly required (Docker is preinstalled), but it prints the Docker version in the log,
      # which makes a Testcontainers failure much quicker to diagnose.
      - name: Show Docker version (used by Testcontainers)
        run: docker version --format 'Docker server {{.Server.Version}}'

      # Linux runner, so ./mvnw (the same wrapper as .\mvnw.cmd on Windows).
      # -B = batch mode: no interactive output, cleaner CI logs.
      - name: Run tests
        run: ./mvnw -B test

      # When something fails, keep the detailed per-test reports so they can be downloaded from the
      # run's summary page instead of scrolling through the whole log.
      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v5
        with:
          name: surefire-reports
          path: target/surefire-reports/
          retention-days: 7
