spring:
  application:
    name: llm-gateway
  threads:
    # Java 21 virtual threads: each request (and each blocking provider call) runs on a cheap
    # virtual thread, so slow LLM calls don't exhaust Tomcat's thread pool.
    virtual:
      enabled: true
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      # Optional; empty for a local Redis without auth.
      password: ${REDIS_PASSWORD:}
      # Short timeouts on purpose: the cache must never make a request slow. If Redis doesn't
      # answer within 500 ms we treat it as a cache miss (the default would wait 60 seconds).
      timeout: 500ms
      connect-timeout: 500ms

server:
  port: ${PORT:8080}
  # Finish in-flight requests before the container stops.
  shutdown: graceful
  error:
    # Never leak stack traces or exception messages in default error responses.
    include-stacktrace: never
    include-message: never

management:
  endpoints:
    web:
      exposure:
        include: health,info
  health:
    redis:
      # The cache is optional (Redis down = cache miss), so Redis being down must not mark the
      # whole gateway DOWN and get the container restarted by its health check.
      enabled: false

# ---------------------------------------------------------------------------------------------
# Gateway settings (bound to GatewayProperties). More sections are added in later steps.
# Secrets are ONLY referenced as ${ENV_VAR:}, never written here. The ":" with nothing after it
# means "empty if not set", so the app still starts and treats the provider as unconfigured.
# ---------------------------------------------------------------------------------------------
gateway:
  # Primary provider, tried first: groq | gemini | cohere. Switch with LLM_PROVIDER, no code change.
  default-provider: ${LLM_PROVIDER:groq}
  fallback:
    # Tried in this order when the primary fails (rate limit, timeout, 5xx...). Comma-separated.
    # Providers without an API key are skipped automatically. Set it empty to disable fallback.
    providers: ${LLM_FALLBACK_PROVIDERS:gemini,cohere}
    # Overall time budget per request across all providers. Once spent, no new provider is tried.
    total-timeout: 60s
  cache:
    # Same prompt text -> answer served from Redis, no provider call.
    enabled: ${CACHE_ENABLED:true}
    # How long an answer stays cached. Examples: 30m, 1h, 1d.
    ttl: ${CACHE_TTL:1h}
  # Used when the client doesn't send max_tokens.
  default-max-tokens: 1024
  providers:
    groq:
      api-key: ${GROQ_API_KEY:}
      base-url: ${GROQ_BASE_URL:https://api.groq.com/openai/v1}
      # Free models change often: check console.groq.com and override with GROQ_MODEL.
      model: ${GROQ_MODEL:openai/gpt-oss-20b}
      connect-timeout: 5s
      read-timeout: 30s
    gemini:
      api-key: ${GEMINI_API_KEY:}
      base-url: ${GEMINI_BASE_URL:https://generativelanguage.googleapis.com/v1beta}
      # Check aistudio.google.com for current model names; override with GEMINI_MODEL.
      model: ${GEMINI_MODEL:gemini-2.5-flash}
      connect-timeout: 5s
      read-timeout: 30s
    cohere:
      api-key: ${COHERE_API_KEY:}
      base-url: ${COHERE_BASE_URL:https://api.cohere.com/v2}
      # Check dashboard.cohere.com for current model names; override with COHERE_MODEL.
      model: ${COHERE_MODEL:command-a-03-2025}
      connect-timeout: 5s
      read-timeout: 30s
